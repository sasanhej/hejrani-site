<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mandelbrot — deep zoom</title>
<meta name="description" content="A Mandelbrot explorer using perturbation theory to zoom far past the limits of floating point.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D11; --panel:rgba(12,14,18,.82); --line:rgba(226,232,240,.16);
    --text:#E2E8F0; --muted:#8A97A6; --accent:#E0A33E;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--mono)}
  canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}

  .hud{position:fixed;font-size:11px;letter-spacing:.05em;line-height:1.75;text-shadow:0 1px 4px rgba(0,0,0,.9)}
  .tl{top:14px;left:16px;pointer-events:none}
  .bl{bottom:14px;left:16px;pointer-events:none;font-variant-numeric:tabular-nums}
  .k{color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.15em}
  .title{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  .warn{color:var(--accent)}

  /* panel */
  .panel{
    position:fixed;top:14px;right:14px;width:250px;max-height:calc(100vh - 28px);
    overflow-y:auto;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;
  }
  .panel.hidden{display:none}
  .grp{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;
       letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .row output{color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;
    background:var(--text);margin-top:-4.5px;border:0}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--text);border:0}
  input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}
  .btns{display:flex;flex-wrap:wrap;gap:4px}
  button{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
  button:hover{color:var(--text);border-color:var(--text)}
  button.on{color:var(--ink);background:var(--accent);border-color:var(--accent)}
  .sep{height:1px;background:var(--line)}
  .note{font-size:9px;color:var(--muted);line-height:1.7;letter-spacing:.04em}
  a{color:var(--muted);border-bottom:1px solid var(--line);text-decoration:none}
  a:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .swatch{height:10px;width:100%;border:1px solid var(--line)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-size:10px;
    letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(10px)}
  .toast.show{opacity:1}
  .fatal{position:fixed;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;font-size:13px;line-height:1.8}
  @media (max-width:720px){ .panel{width:auto;left:14px;right:14px;top:auto;bottom:14px;max-height:52vh} .bl{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud tl">
  <div class="title">Mandelbrot</div>
  <div class="k" id="hint">drag · scroll · H for panel</div>
</div>

<div class="hud bl">
  <div><span class="k">zoom</span> <span id="zoom">1×</span> <span id="warn" class="warn"></span></div>
  <div><span class="k">iter</span> <span id="iter">—</span> <span class="k">ref</span> <span id="reflen">—</span></div>
  <div><span class="k">re</span> <span id="re">—</span></div>
  <div><span class="k">im</span> <span id="im">—</span></div>
</div>

<div class="panel" id="panel">
  <div class="grp">
    <div class="row"><span>Palette</span></div>
    <div class="swatch" id="swatch"></div>
  </div>
  <div class="grp">
    <div class="row"><label for="hue">Hue</label><output id="o-hue">0°</output></div>
    <input type="range" id="hue" min="0" max="360" value="0">
  </div>
  <div class="grp">
    <div class="row"><label for="cycle">Bands</label><output id="o-cycle">32</output></div>
    <input type="range" id="cycle" min="4" max="160" value="32">
  </div>
  <div class="grp">
    <div class="row"><label for="sat">Saturation</label><output id="o-sat">70%</output></div>
    <input type="range" id="sat" min="0" max="100" value="70">
  </div>
  <div class="grp">
    <div class="row"><label for="shift">Offset</label><output id="o-shift">0</output></div>
    <input type="range" id="shift" min="0" max="100" value="0">
  </div>
  <div class="btns">
    <button data-pal="0" class="on">Smooth</button>
    <button data-pal="1">Fire</button>
    <button data-pal="2">Ice</button>
    <button data-pal="3">Mono</button>
  </div>

  <div class="sep"></div>

  <div class="grp">
    <div class="row"><label for="maxit">Max iterations</label><output id="o-maxit">3000</output></div>
    <input type="range" id="maxit" min="500" max="60000" step="500" value="3000">
  </div>
  <div class="btns">
    <button id="aa">AA off</button>
    <button id="de" class="on">Contour</button>
  </div>

  <div class="sep"></div>
  <div class="row"><span>Places</span></div>
  <div class="btns" id="places"></div>

  <div class="sep"></div>
  <div class="btns">
    <button id="copy">Copy link</button>
    <button id="save">Save PNG</button>
    <button id="reset">Reset</button>
  </div>
  <div class="note">
    Perturbation rendering — one orbit at arbitrary precision, every pixel a small
    offset from it. <a href="about.html">How it works →</a>
  </div>
  <div class="note"><a href="https://hejrani.com">hejrani.com</a></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias:false, preserveDrawingBuffer:true });
if (!gl){
  document.body.innerHTML = '<div class="fatal">This needs WebGL2.<br><br><a href="https://hejrani.com">hejrani.com</a></div>';
  throw new Error('no webgl2');
}
const extF = gl.getExtension('EXT_color_buffer_float');

/* ── decimal-string arithmetic for the view centre ─────────────────────────
   The centre must survive depths where a double has no digits left, so it is
   kept as a string and moved with BigInt fixed point.                        */
const FRAC = 4096n;                     // sub-pixel resolution (1n<<12n)
function bitsFor(zoomExp){ return Math.max(96, Math.ceil(zoomExp * 3.322) + 96); }

function fromString(s, shift){
  const S = BigInt(shift);
  let neg = false;
  s = String(s).trim();
  if (s[0] === '-'){ neg = true; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
  const [ip, fp=''] = s.split('.');
  let v = BigInt(ip || '0') << S;
  if (fp.length){ const d = 10n ** BigInt(fp.length); v += ((BigInt(fp) << S) + d/2n) / d; }
  return neg ? -v : v;
}
function toStringFixed(v, shift, digits){
  const S = BigInt(shift);
  const neg = v < 0n; if (neg) v = -v;
  const ip = v >> S; let frac = v - (ip << S);
  const ds = [];
  for (let i = 0; i <= digits; i++){ frac *= 10n; const d = frac >> S; ds.push(Number(d)); frac -= d << S; }
  if (ds.pop() >= 5){ let i = ds.length-1; for(; i>=0; i--){ if (++ds[i] < 10) break; ds[i]=0; }
    if (i < 0) return (neg?'-':'') + (ip+1n).toString() + '.' + ds.join(''); }
  return (neg?'-':'') + ip.toString() + '.' + ds.join('');
}

/* view state: centre as strings, zoom as a decimal exponent */
const view = { cx:'-0.5', cy:'0.0', zoomExp:0, maxIter:3000 };
const PLACES = {
  Home:      { cx:'-0.5', cy:'0.0', zoomExp:0, maxIter:800 },
  Seahorse:  { cx:'-0.743643887037158704752191506114774', cy:'0.131825904205311970493132056385139', zoomExp:11, maxIter:4000 },
  Spiral:    { cx:'-0.16070135', cy:'1.0375665', zoomExp:6, maxIter:2000 },
  Minibrot:  { cx:'-1.768778833', cy:'0.001738996', zoomExp:8, maxIter:3000 },
  Tendril:   { cx:'-0.235125', cy:'0.827215', zoomExp:6, maxIter:2500 },
  Deep:      { cx:'-0.743643887037158704752191506114774', cy:'0.131825904205311970493132056385139', zoomExp:18, maxIter:11000 },
  Deeper:    { cx:'-0.743643887037158704752191506114774', cy:'0.131825904205311970493132056385139', zoomExp:24, maxIter:16000 }
};

/* ── shader ─────────────────────────────────────────────────────────────── */
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
out vec4 outColor;

uniform sampler2D uRef;        // reference orbit, RG32F: (Zx, Zy)
uniform int   uRefLen;
uniform int   uRefW;
uniform int   uMaxIter;
uniform vec2  uRes;
uniform float uPixel;          // δc per pixel, in scaled units this is 1.0
uniform float uInvS;           // 1/S  — the true size of one scaled unit
uniform int   uAA;             // samples per axis
uniform float uHue, uCycle, uSat, uShift;
uniform int   uPalette;
uniform int   uContour;

vec2 refAt(int i){
  int x = i % uRefW, y = i / uRefW;
  return texelFetch(uRef, ivec2(x,y), 0).xy;
}

vec3 hsl(float h, float s, float l){
  vec3 k = mod(vec3(0.,8.,4.) + h*12., 12.);
  float a = s * min(l, 1.-l);
  return l - a * max(min(min(k-3., 9.-k), 1.), -1.);
}

vec3 palette(float t){
  t = fract(t + uShift);
  if (uPalette == 3) return vec3(t);
  if (uPalette == 1){                                  // fire
    return clamp(vec3(1.6*t, 1.9*t*t - .35, 3.2*t*t*t*t - .55), 0., 1.);
  }
  if (uPalette == 2){                                  // ice
    return clamp(vec3(.25 + .75*t*t, .45 + .55*t, .75 + .25*sqrt(t)) * (0.25 + 0.9*t), 0., 1.);
  }
  return hsl(fract(uHue/360. + t), uSat, 0.08 + 0.72*t); // smooth
}

/* one sample: perturbed iteration with rebasing */
vec2 sample1(vec2 dc){
  vec2 d = vec2(0.);         // δ₀ = 0 — δc enters only through the update
  int m = 0;                 // index into the reference orbit
  int n = 0;
  vec2 z = vec2(0.);
  vec2 dzdc = vec2(0.);      // derivative, for the contour estimate
  float mag = 0.;

  for (int k = 0; k < 65536; k++){
    if (n >= uMaxIter) break;

    vec2 Z = refAt(m);
    vec2 dTrue = d * uInvS;
    z = Z + dTrue;
    mag = dot(z, z);

    if (mag > 65536.0) break;                 // escaped

    // Zhuoran rebasing: when the true value is smaller than the offset,
    // the reference has stopped helping — restart from z itself.
    if (mag < dot(dTrue, dTrue) || m + 1 >= uRefLen){
      d = z / uInvS;
      m = 0;
      Z = refAt(0);
    }

    // derivative in the same scaled units
    dzdc = 2.0 * vec2(z.x*dzdc.x - z.y*dzdc.y, z.x*dzdc.y + z.y*dzdc.x) + vec2(1.,0.);

    // δ' = 2·Z·δ + δ²  + δc   (δ² written to avoid overflow at large δ)
    vec2 twoZd = 2.0 * vec2(Z.x*d.x - Z.y*d.y, Z.x*d.y + Z.y*d.x);
    vec2 dScaled = d * uInvS;
    vec2 dSq = vec2(dScaled.x*d.x - dScaled.y*d.y, dScaled.x*d.y + dScaled.y*d.x);
    d = twoZd + dSq + dc;

    m++;          // advance the reference index for the next step
    n++;
  }

  if (n >= uMaxIter) return vec2(-1., 0.);

  float sm = float(n) + 1.0 - log2(max(log2(max(mag,1.0001)) * 0.5, 1e-9));
  float de = 0.0;
  if (uContour == 1){
    float dz = length(dzdc) * uInvS;
    de = dz > 0.0 ? sqrt(mag) * log(max(sqrt(mag),1.0001)) / dz : 0.0;
  }
  return vec2(sm, de);
}

void main(){
  vec2 px = gl_FragCoord.xy - 0.5*uRes;
  vec3 acc = vec3(0.);
  int S = uAA;
  for (int j = 0; j < 4; j++){
    if (j >= S) break;
    for (int i = 0; i < 4; i++){
      if (i >= S) break;
      vec2 off = (vec2(float(i), float(j)) + 0.5) / float(S) - 0.5;
      vec2 r = sample1(px + off);
      if (r.x < 0.0){ acc += vec3(0.02,0.025,0.035); continue; }
      vec3 col = palette(sqrt(max(r.x,0.)) / uCycle);
      if (uContour == 1){
        float e = clamp(r.y * 1.2, 0.0, 1.0);
        col *= 0.15 + 0.85 * pow(e, 0.42);       // dark right at the boundary
      }
      acc += col;
    }
  }
  outColor = vec4(acc / float(S*S), 1.0);
}`;

function compile(t, src){
  const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog;
try{
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
}catch(err){
  document.body.innerHTML = '<div class="fatal">Shader failed on this device.<br><br><span style="color:#8A97A6;font-size:11px">'+String(err.message).slice(0,400)+'</span></div>';
  throw err;
}
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const ploc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(ploc);
gl.vertexAttribPointer(ploc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog, n);
const u = {
  ref:U('uRef'), refLen:U('uRefLen'), refW:U('uRefW'), maxIter:U('uMaxIter'),
  res:U('uRes'), pixel:U('uPixel'), invS:U('uInvS'), aa:U('uAA'),
  hue:U('uHue'), cycle:U('uCycle'), sat:U('uSat'), shift:U('uShift'),
  palette:U('uPalette'), contour:U('uContour')
};

/* reference orbit texture */
const REF_W = 2048;
const refTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, refTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.uniform1i(u.ref, 0);
let refLen = 0;

function uploadOrbit(zx, zy, len){
  const rows = Math.max(1, Math.ceil(len / REF_W));
  const data = new Float32Array(REF_W * rows * 2);
  for (let i = 0; i < len; i++){ data[i*2] = zx[i]; data[i*2+1] = zy[i]; }
  gl.bindTexture(gl.TEXTURE_2D, refTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, REF_W, rows, 0, gl.RG, gl.FLOAT, data);
  refLen = len;
  document.getElementById('reflen').textContent = len.toLocaleString();
}

/* ── worker ── */
const worker = new Worker('reference-worker.js');
let jobId = 0, pending = false;
worker.onmessage = (e) => {
  const d = e.data;
  if (d.type === 'progress'){ toast(`reference orbit ${Math.round(100*d.n/d.maxIter)}%`, 400); return; }
  if (d.type === 'orbit' && d.id === jobId){
    uploadOrbit(d.zx, d.zy, d.length);
    pending = false;
    draw();
  }
};

function requestOrbit(){
  jobId++;
  pending = true;
  const shift = bitsFor(view.zoomExp);
  worker.postMessage({ id: jobId, cxStr: view.cx, cyStr: view.cy, maxIter: view.maxIter, shift });
}

/* ── panning / zooming in high precision ── */
function spanStr(){ return 4 / Math.pow(10, Math.min(view.zoomExp, 300)); }

function shiftCentre(dxPix, dyPix){
  // move the centre by a pixel offset, at full precision
  const shift = bitsFor(view.zoomExp);
  const S = BigInt(shift);
  const cx = fromString(view.cx, shift), cy = fromString(view.cy, shift);
  // pixel size = span / width, as a fixed-point value
  const spanNum = 4;                                   // width of the view in complex units at zoom 1
  const pw = canvas.width;
  // span = spanNum / 10^zoomExp  →  in fixed point
  let span = (BigInt(spanNum) << S);
  const e = Math.round(view.zoomExp);
  span = span / (10n ** BigInt(e));
  // fractional part of zoomExp handled as a double multiplier
  const fracMul = Math.pow(10, e - view.zoomExp);      // in (0.1, 1]
  const pixel = (span * BigInt(Math.round(fracMul * 1e12))) / (BigInt(pw) * 1000000000000n);
  // 1/4096-pixel resolution: zoom-to-cursor produces fractional offsets
  const sx = BigInt(Math.round(dxPix * 4096)), sy = BigInt(Math.round(dyPix * 4096));
  view.cx = toStringFixed(cx + (pixel * sx) / FRAC, shift, digits());
  view.cy = toStringFixed(cy + (pixel * sy) / FRAC, shift, digits());
}
function digits(){ return Math.min(400, Math.ceil(view.zoomExp) + 12); }

/* ── palette / render ── */
const el = id => document.getElementById(id);
const cfg = { hue:0, cycle:32, sat:0.7, shift:0, palette:0, aa:1, contour:1 };

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  gl.viewport(0,0,w,h);
}

let rafPending = false;
function draw(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}

function render(){
  resize();
  if (!refLen) return;
  // S is chosen so one scaled unit == one pixel
  const spanF = 4 / Math.pow(10, view.zoomExp);
  const pixel = spanF / canvas.width;

  gl.uniform1i(u.refLen, refLen);
  gl.uniform1i(u.refW, REF_W);
  gl.uniform1i(u.maxIter, view.maxIter);
  gl.uniform2f(u.res, canvas.width, canvas.height);
  gl.uniform1f(u.pixel, 1.0);
  gl.uniform1f(u.invS, pixel);
  gl.uniform1i(u.aa, cfg.aa);
  gl.uniform1f(u.hue, cfg.hue);
  gl.uniform1f(u.cycle, cfg.cycle);
  gl.uniform1f(u.sat, cfg.sat);
  gl.uniform1f(u.shift, cfg.shift);
  gl.uniform1i(u.palette, cfg.palette);
  gl.uniform1i(u.contour, cfg.contour);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  el('zoom').textContent = fmtZoom(view.zoomExp);
  el('iter').textContent = view.maxIter.toLocaleString();
  el('re').textContent = trim(view.cx);
  el('im').textContent = trim(view.cy);
  const w = el('warn');
  w.textContent = view.zoomExp > 26 ? '· past verified depth' : '';
  writeHash();
  paintSwatch();
}

function trim(s){ const d = Math.min(digits(), 30); const [a,b=''] = s.split('.'); return a + '.' + b.slice(0,d); }
function fmtZoom(e){
  if (e < 3) return (Math.pow(10,e)).toFixed(1) + '×';
  return '10' + String(Math.round(e*10)/10).split('').map(ch => ({'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','.':'·','-':'⁻'}[ch]||ch)).join('');
}

function paintSwatch(){
  const sw = el('swatch');
  const stops = [];
  for (let i = 0; i <= 10; i++){
    const t = i/10;
    stops.push(cssPal(t) + ' ' + (t*100) + '%');
  }
  sw.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
}
function cssPal(t){
  t = (t + cfg.shift) % 1;
  if (cfg.palette === 3) return `rgb(${(t*255)|0},${(t*255)|0},${(t*255)|0})`;
  if (cfg.palette === 1) return `rgb(${Math.min(255,1.6*t*255)|0},${Math.max(0,Math.min(255,(1.9*t*t-.35)*255))|0},${Math.max(0,Math.min(255,(3.2*t*t*t*t-.55)*255))|0})`;
  if (cfg.palette === 2) return `rgb(${Math.min(255,(.25+.75*t*t)*(0.25+0.9*t)*255)|0},${Math.min(255,(.45+.55*t)*(0.25+0.9*t)*255)|0},${Math.min(255,(.75+.25*Math.sqrt(t))*(0.25+0.9*t)*255)|0})`;
  const h = ((cfg.hue/360 + t) % 1) * 360, l = 0.08+0.72*t;
  return `hsl(${h} ${cfg.sat*100}% ${l*100}%)`;
}

/* ── URL hash ── */
let hashLock = false;
function writeHash(){
  if (hashLock) return;
  const p = new URLSearchParams();
  p.set('re', view.cx); p.set('im', view.cy);
  p.set('z', view.zoomExp.toFixed(3)); p.set('i', view.maxIter);
  p.set('p', cfg.palette); p.set('h', Math.round(cfg.hue));
  p.set('c', Math.round(cfg.cycle)); p.set('s', Math.round(cfg.sat*100));
  p.set('o', Math.round(cfg.shift*100));
  history.replaceState(null, '', '#' + p.toString());
}
function readHash(){
  if (!location.hash.length) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get('re')) return false;
  view.cx = p.get('re'); view.cy = p.get('im') || '0.0';
  view.zoomExp = parseFloat(p.get('z') || '0');
  view.maxIter = parseInt(p.get('i') || '3000', 10);
  cfg.palette = parseInt(p.get('p') || '0', 10);
  cfg.hue = parseFloat(p.get('h') || '0');
  cfg.cycle = parseFloat(p.get('c') || '32');
  cfg.sat = parseFloat(p.get('s') || '70')/100;
  cfg.shift = parseFloat(p.get('o') || '0')/100;
  syncInputs();
  return true;
}
function syncInputs(){
  el('hue').value = cfg.hue; el('o-hue').textContent = Math.round(cfg.hue)+'°';
  el('cycle').value = cfg.cycle; el('o-cycle').textContent = Math.round(cfg.cycle);
  el('sat').value = cfg.sat*100; el('o-sat').textContent = Math.round(cfg.sat*100)+'%';
  el('shift').value = cfg.shift*100; el('o-shift').textContent = Math.round(cfg.shift*100);
  el('maxit').value = view.maxIter; el('o-maxit').textContent = view.maxIter.toLocaleString();
  document.querySelectorAll('[data-pal]').forEach(b => b.classList.toggle('on', +b.dataset.pal === cfg.palette));
  el('aa').textContent = 'AA ' + (cfg.aa > 1 ? cfg.aa + '×' : 'off');
  el('aa').classList.toggle('on', cfg.aa > 1);
  el('de').classList.toggle('on', cfg.contour === 1);
}

/* ── interaction ── */
function zoomAt(px, py, factor, anchor){
  // anchor: hold the point under the cursor still. The centre only needs to
  // travel (1 - factor) of the way to it — moving the full distance would
  // centre that point instead, which is the bug this replaces.
  const k = anchor ? (1 - factor) : 1;
  shiftCentre(px * k, py * k);
  view.zoomExp += Math.log10(1/factor);
  view.zoomExp = Math.max(0, view.zoomExp);
  view.maxIter = Math.max(view.maxIter, Math.round(600 + 900 * Math.max(0, view.zoomExp)));
  el('maxit').value = Math.min(60000, view.maxIter);
  el('o-maxit').textContent = view.maxIter.toLocaleString();
  requestOrbit();
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const dpr = canvas.width / r.width;
  const px = (e.clientX - r.left) * dpr - canvas.width/2;
  const py = canvas.height/2 - (e.clientY - r.top) * dpr;
  zoomAt(px, py, Math.exp(e.deltaY * 0.0012), true);
}, { passive:false });

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = canvas.getBoundingClientRect();
  const dpr = canvas.width / r.width;
  shiftCentre(-(e.clientX - drag.x)*dpr, (e.clientY - drag.y)*dpr);
  drag = {x:e.clientX, y:e.clientY};
  requestOrbit();
});
addEventListener('pointerup', () => { drag = null; canvas.classList.remove('drag'); });
canvas.addEventListener('dblclick', e => {
  const r = canvas.getBoundingClientRect();
  const dpr = canvas.width / r.width;
  zoomAt((e.clientX-r.left)*dpr - canvas.width/2, canvas.height/2 - (e.clientY-r.top)*dpr, 0.4, false);
});

/* controls */
const bind = (id, key, fmt, scale=1) => el(id).addEventListener('input', e => {
  cfg[key] = e.target.value/scale; el('o-'+id).textContent = fmt(e.target.value); draw();
});
bind('hue','hue', v => Math.round(v)+'°');
bind('cycle','cycle', v => Math.round(v));
bind('sat','sat', v => Math.round(v)+'%', 100);
bind('shift','shift', v => Math.round(v), 100);
el('maxit').addEventListener('input', e => {
  view.maxIter = +e.target.value; el('o-maxit').textContent = view.maxIter.toLocaleString(); requestOrbit();
});
document.querySelectorAll('[data-pal]').forEach(b => b.addEventListener('click', () => {
  cfg.palette = +b.dataset.pal; syncInputs(); draw();
}));
el('aa').addEventListener('click', () => { cfg.aa = cfg.aa === 1 ? 2 : (cfg.aa === 2 ? 3 : 1); syncInputs(); draw(); });
el('de').addEventListener('click', () => { cfg.contour ^= 1; syncInputs(); draw(); });
el('reset').addEventListener('click', () => go(PLACES.Home));
el('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.href); toast('link copied'); }
  catch { toast('copy failed — use the address bar'); }
});
el('save').addEventListener('click', () => {
  render();
  const a = document.createElement('a');
  a.download = 'mandelbrot-' + view.zoomExp.toFixed(1) + '.png';
  a.href = canvas.toDataURL('image/png'); a.click();
});

const placesEl = el('places');
Object.keys(PLACES).forEach(k => {
  const b = document.createElement('button'); b.textContent = k;
  b.onclick = () => go(PLACES[k]);
  placesEl.appendChild(b);
});
function go(p){ Object.assign(view, p); syncInputs(); requestOrbit(); }

addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') el('panel').classList.toggle('hidden');
  if (e.key === 'r') go(PLACES.Home);
});
addEventListener('resize', () => { resize(); draw(); });
addEventListener('hashchange', () => { if (!hashLock && readHash()) requestOrbit(); });

let toastT;
function toast(msg, ms=1400){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* boot */
if (!readHash()) Object.assign(view, PLACES.Home);
syncInputs();
resize();
requestOrbit();
</script>
</body>
</html>
